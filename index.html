<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi RFID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .badge-rfid { font-family: monospace; background: #eee; padding: 4px 8px; border-radius: 4px; color: #333; }
    .stat-card { padding: 20px; border-radius: 12px; color: white; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="min-vh-100 d-flex align-items-center justify-content-center bg-primary">
    <div class="card p-4 shadow-lg text-center" style="max-width: 400px; width: 100%;">
      <i class="fa-solid fa-id-badge fa-4x text-primary mb-3"></i>
      <h4 class="fw-bold">Login Admin</h4>
      <form onsubmit="login(event)" class="mt-4">
        <input type="text" id="username" class="form-control mb-3" placeholder="Username (admin)" required>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password (admin123)" required>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardScreen" class="d-none">
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-id-card me-2"></i>Presensi Siswa</a>
        <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button>
      </div>
    </nav>

    <div class="container">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="stat-card bg-primary d-flex justify-content-between align-items-center">
            <div><h6 class="mb-1">Total Siswa</h6><h2 id="totalSiswa" class="fw-bold mb-0">0</h2></div>
            <i class="fa-solid fa-users fa-3x opacity-50"></i>
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card bg-success d-flex justify-content-between align-items-center">
            <div><h6 class="mb-1">Hadir Terakhir</h6><h2 id="totalAbsen" class="fw-bold mb-0">0</h2></div>
            <i class="fa-solid fa-check-circle fa-3x opacity-50"></i>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold m-0"><i class="fa-solid fa-database text-primary me-2"></i>Data Siswa</h5>
              <button class="btn btn-primary btn-sm fw-bold" onclick="bukaModal()"><i class="fa-solid fa-plus me-1"></i>Tambah</button>
            </div>
            
            <!-- ALAT PENCARIAN & FILTER -->
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <input type="text" id="cariData" class="form-control" placeholder="Cari Nama, NIS, atau RFID..." oninput="renderTabel()">
              </div>
              <div class="col-md-6">
                <select id="filterKelas" class="form-select" onchange="renderTabel()">
                  <option value="">-- Semua Kelas --</option>
                </select>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                  <tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>RFID</th><th class="text-center">Aksi</th></tr>
                </thead>
                <tbody id="tabelSiswa"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm p-3 mb-4 border-success">
            <h5 class="fw-bold text-success mb-3"><i class="fa-solid fa-wifi me-2"></i>Tap Kartu</h5>
            <form onsubmit="tapKartu(event)">
              <input type="text" id="tapInput" class="form-control text-center fw-bold fs-5 mb-2" placeholder="Scan Kartu..." required autocomplete="off">
              <button type="submit" class="btn btn-success w-100 fw-bold">TAP PRESENSI</button>
            </form>
          </div>

          <div class="card shadow-sm p-3">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-history me-2"></i>Riwayat</h5>
            <div class="table-responsive">
              <table class="table table-sm">
                <tbody id="tabelRiwayat"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="siswaModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="modalTitle">Tambah Siswa</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="simpanSiswa(event)">
          <div class="modal-body">
            <input type="hidden" id="sId">
            <div class="mb-2"><label class="fw-bold">NIS</label><input type="text" id="sNis" class="form-control" required></div>
            <div class="mb-2"><label class="fw-bold">Nama Lengkap</label><input type="text" id="sNama" class="form-control" required></div>
            <div class="mb-2"><label class="fw-bold">Kelas</label><input type="text" id="sKelas" class="form-control" placeholder="Contoh: 10 IPA 1" required></div>
            <div class="mb-2"><label class="fw-bold">UID RFID</label><input type="text" id="sRfid" class="form-control" required></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary fw-bold w-100">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let dbSiswa = [], modalApp;

    document.addEventListener("DOMContentLoaded", () => {
      modalApp = new bootstrap.Modal(document.getElementById('siswaModal'));
      if(localStorage.getItem('isLogin') === '1') showDashboard();
    });

    async function login(e) {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value, password: password.value })
      });
      const data = await res.json();
      if(data.success) { localStorage.setItem('isLogin', '1'); showDashboard(); }
      else alert(data.message);
    }

    function logout() { localStorage.clear(); location.reload(); }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('d-none');
      document.getElementById('dashboardScreen').classList.remove('d-none');
      loadSemua();
    }

    async function loadSemua() {
      try {
        const [resSiswa, resAbsen, resKelas] = await Promise.all([ fetch('/api/siswa'), fetch('/api/absensi'), fetch('/api/kelas') ]);
        const dataSiswa = await resSiswa.json();
        const dataAbsen = await resAbsen.json();
        const dataKelas = await resKelas.json();

        if (dataSiswa.success) dbSiswa = dataSiswa.data;
        document.getElementById('totalSiswa').innerText = dbSiswa.length;
        document.getElementById('totalAbsen').innerText = (dataAbsen.data || []).length;

        // Set Dropdown Kelas
        const filterEl = document.getElementById('filterKelas');
        filterEl.innerHTML = '<option value="">-- Semua Kelas --</option>' + (dataKelas.data || []).map(k => `<option value="${k}">${k}</option>`).join('');

        renderTabel();
        renderRiwayat(dataAbsen.data || []);
      } catch (err) { console.error(err); }
    }

    // FUNGSI PENCARIAN & RENDER
    function renderTabel() {
      const q = document.getElementById('cariData').value.toLowerCase();
      const k = document.getElementById('filterKelas').value;
      const tbody = document.getElementById('tabelSiswa');

      const hasil = dbSiswa.filter(s => {
        const matchKata = s.nama.toLowerCase().includes(q) || s.nis.toLowerCase().includes(q) || s.rfid_uid.toLowerCase().includes(q);
        const matchKelas = k === "" || s.kelas === k;
        return matchKata && matchKelas;
      });

      if(hasil.length === 0) return tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3">Data tidak ditemukan.</td></tr>`;

      tbody.innerHTML = hasil.map((s, i) => `
        <tr>
          <td class="text-center">${i + 1}</td>
          <td class="fw-bold">${s.nis}</td>
          <td>${s.nama}</td>
          <td><span class="badge bg-secondary">${s.kelas}</span></td>
          <td><span class="badge-rfid">${s.rfid_uid}</span></td>
          <td class="text-center">
            <button class="btn btn-warning btn-sm" onclick='editSiswa(${JSON.stringify(s)})'><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-danger btn-sm" onclick="hapusSiswa(${s.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function renderRiwayat(hist) {
      const tb = document.getElementById('tabelRiwayat');
      if(!hist.length) return tb.innerHTML = `<tr><td class="text-center text-muted">Belum ada absen</td></tr>`;
      tb.innerHTML = hist.slice(0, 5).map(h => `<tr><td class="fw-bold">${h.nama}</td><td>${h.kelas}</td></tr>`).join('');
    }

    function bukaModal() {
      document.getElementById('modalTitle').innerText = "Tambah Siswa";
      document.getElementById('sId').value = "";
      document.getElementById('sNis').value = "";
      document.getElementById('sNama').value = "";
      document.getElementById('sKelas').value = "";
      document.getElementById('sRfid').value = "";
      modalApp.show();
    }

    function editSiswa(s) {
      document.getElementById('modalTitle').innerText = "Edit Siswa";
      document.getElementById('sId').value = s.id;
      document.getElementById('sNis').value = s.nis;
      document.getElementById('sNama').value = s.nama;
      document.getElementById('sKelas').value = s.kelas;
      document.getElementById('sRfid').value = s.rfid_uid;
      modalApp.show();
    }

    async function simpanSiswa(e) {
      e.preventDefault();
      const payload = {
        id: document.getElementById('sId').value,
        nis: document.getElementById('sNis').value,
        nama: document.getElementById('sNama').value,
        kelas: document.getElementById('sKelas').value,
        rfid_uid: document.getElementById('sRfid').value
      };

      const res = await fetch('/api/siswa', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
      const data = await res.json();
      if(data.success) { modalApp.hide(); loadSemua(); }
      else alert(data.message);
    }

    async function hapusSiswa(id) {
      if(!confirm("Hapus siswa ini?")) return;
      await fetch(`/api/siswa/${id}`, { method: 'DELETE' });
      loadSemua();
    }

    async function tapKartu(e) {
      e.preventDefault();
      const el = document.getElementById('tapInput');
      const res = await fetch('/api/tap', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ rfid_uid: el.value }) });
      const data = await res.json();
      alert(data.message);
      el.value = "";
      loadSemua();
      el.focus();
    }
  </script>
</body>
</html>

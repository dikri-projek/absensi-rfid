<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi RFID Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-600">
      <h1 class="text-2xl font-bold text-gray-800">Sistem Informasi Presensi RFID</h1>
      <p class="text-gray-500 text-sm">Kelola Data Siswa, Presensi RFID, dan Rekapitulasi</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- FORM INPUT & EDIT SISWA -->
      <div class="bg-white p-6 rounded-xl shadow-md h-fit">
        <h2 id="form-title" class="text-lg font-bold text-gray-700 mb-4 pb-2 border-b">Tambah Siswa Baru</h2>
        
        <form id="form-siswa" onsubmit="saveSiswa(event)" class="space-y-4">
          <input type="hidden" id="nis" value="">

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Nama Siswa <span class="text-red-500">*</span></label>
            <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Kelas <span class="text-red-500">*</span></label>
            <input type="text" id="kelas" required placeholder="Contoh: XII IPA 1" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Kode / Nomor RFID (Opsional)</label>
            <input type="text" id="rfid_uid" placeholder="Contoh: 12345678" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Simpan Data</button>
            <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-semibold px-4 py-2 rounded-lg transition">Batal</button>
          </div>
        </form>
      </div>

      <!-- TABEL DATA SISWA TERDAFTAR -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
          <h2 class="text-lg font-bold text-gray-700">Daftar Siswa Terdaftar</h2>
          <button onclick="loadSiswa()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-gray-700 font-medium">🔄 Refresh</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-50 text-gray-700 uppercase text-xs">
              <tr>
                <th class="p-3">No</th>
                <th class="p-3">Nama</th>
                <th class="p-3">Kelas</th>
                <th class="p-3">RFID UID</th>
                <th class="p-3 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="table-siswa" class="divide-y">
              <tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- FITUR PRESENSI (TAP RFID & MANUAL) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- SIMULASI TAP RFID -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-lg font-bold text-gray-700 mb-4 pb-2 border-b">Tap Kartu RFID</h2>
        <form onsubmit="tapRfid(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Scan / Masukkan Kode RFID</label>
            <input type="text" id="tap_rfid" required placeholder="Tempelkan kartu atau ketik UID" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">Proses Tap</button>
        </form>
      </div>

      <!-- PRESENSI MANUAL -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-lg font-bold text-gray-700 mb-4 pb-2 border-b">Presensi Manual</h2>
        <form onsubmit="saveAbsensiManual(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Pilih Siswa</label>
            <select id="select_siswa" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
              <option value="">-- Pilih Siswa --</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Keterangan</label>
            <select id="keterangan" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
              <option value="Hadir">Hadir</option>
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
              <option value="Alpha">Alpha</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 rounded-lg transition">Simpan Presensi</button>
        </form>
      </div>

    </div>

    <!-- TABEL REKAP ABSENSI -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h2 class="text-lg font-bold text-gray-700">Riwayat Presensi Siswa</h2>
        <button onclick="loadAbsensi()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-gray-700 font-medium">🔄 Refresh</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-50 text-gray-700 uppercase text-xs">
            <tr>
              <th class="p-3">No</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Kelas</th>
              <th class="p-3">Waktu</th>
              <th class="p-3">Keterangan</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="table-absensi" class="divide-y">
            <tr><td colspan="6" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let listSiswa = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadSiswa();
      loadAbsensi();
    });

    // 1. LOAD DATA SISWA
    async function loadSiswa() {
      try {
        const res = await fetch('/api/siswa');
        const result = await res.json();
        
        const tbody = document.getElementById('table-siswa');
        const select = document.getElementById('select_siswa');
        
        tbody.innerHTML = '';
        select.innerHTML = '<option value="">-- Pilih Siswa --</option>';

        if (result.success && result.data.length > 0) {
          listSiswa = result.data;
          
          result.data.forEach((siswa, index) => {
            const rfidVal = siswa.rfid || siswa.rfid_uid || siswa.uid || '-';
            
            // Render Tabel
            tbody.innerHTML += `
              <tr class="hover:bg-gray-50">
                <td class="p-3 font-medium text-gray-500">${index + 1}</td>
                <td class="p-3 font-semibold text-gray-800">${siswa.nama || '-'}</td>
                <td class="p-3">${siswa.kelas || '-'}</td>
                <td class="p-3 font-mono text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded inline-block my-2">${rfidVal}</td>
                <td class="p-3 text-center">
                  <button onclick="editSiswa(${index})" class="text-xs bg-amber-500 hover:bg-amber-600 text-white font-medium px-2.5 py-1 rounded mr-1">Edit</button>
                  <button onclick="deleteSiswa('${siswa.id || siswa.nis}')" class="text-xs bg-red-500 hover:bg-red-600 text-white font-medium px-2.5 py-1 rounded">Hapus</button>
                </td>
              </tr>
            `;

            // Render Select Option Manual Absen
            select.innerHTML += `<option value="${siswa.id || siswa.nis}">${siswa.nama} (${siswa.kelas})</option>`;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada siswa terdaftar.</td></tr>';
        }
      } catch (err) {
        console.error("Gagal muat siswa:", err);
      }
    }

    // 2. SIMPAN / UPDATE SISWA
    async function saveSiswa(e) {
      e.preventDefault();
      const nis = document.getElementById('nis').value;
      const nama = document.getElementById('nama').value;
      const kelas = document.getElementById('kelas').value;
      const rfid_uid = document.getElementById('rfid_uid').value;

      try {
        const res = await fetch('/api/siswa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nis, nama, kelas, rfid_uid })
        });
        const result = await res.json();

        if (result.success) {
          alert(result.message);
          resetForm();
          loadSiswa();
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      }
    }

    // 3. EDIT SISWA
    function editSiswa(index) {
      const siswa = listSiswa[index];
      document.getElementById('form-title').innerText = "Edit Data Siswa";
      document.getElementById('nis').value = siswa.nis || siswa.id;
      document.getElementById('nama').value = siswa.nama || '';
      document.getElementById('kelas').value = siswa.kelas || '';
      document.getElementById('rfid_uid').value = siswa.rfid || siswa.rfid_uid || '';
      document.getElementById('btn-cancel').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('form-title').innerText = "Tambah Siswa Baru";
      document.getElementById('nis').value = '';
      document.getElementById('form-siswa').reset();
      document.getElementById('btn-cancel').classList.add('hidden');
    }

    // 4. HAPUS SISWA
    async function deleteSiswa(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus siswa ini?")) return;

      try {
        const res = await fetch(`/api/siswa/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          alert(result.message);
          loadSiswa();
        } else {
          alert("Gagal menghapus: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      }
    }

    // 5. TAP RFID
    async function tapRfid(e) {
      e.preventDefault();
      const rfid_uid = document.getElementById('tap_rfid').value;

      try {
        const res = await fetch('/api/tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rfid_uid })
        });
        const result = await res.json();

        if (result.success) {
          alert(result.message);
          document.getElementById('tap_rfid').value = '';
          loadAbsensi();
        } else {
          alert("Tap Gagal: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan sistem.");
      }
    }

    // 6. ABSENSI MANUAL
    async function saveAbsensiManual(e) {
      e.preventDefault();
      const siswa_id = document.getElementById('select_siswa').value;
      const keterangan = document.getElementById('keterangan').value;

      if (!siswa_id) return alert("Pilih siswa terlebih dahulu.");

      try {
        const res = await fetch('/api/absensi/manual', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ siswa_id, keterangan })
        });
        const result = await res.json();

        if (result.success) {
          alert(result.message);
          loadAbsensi();
        } else {
          alert("Gagal Simpan: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      }
    }

    // 7. LOAD REKAP ABSENSI
    async function loadAbsensi() {
      try {
        const res = await fetch('/api/absensi');
        const result = await res.json();
        const tbody = document.getElementById('table-absensi');
        tbody.innerHTML = '';

        if (result.success && result.data.length > 0) {
          result.data.forEach((absen, index) => {
            let statusBadge = 'bg-green-100 text-green-700';
            if (absen.keterangan === 'Izin') statusBadge = 'bg-yellow-100 text-yellow-700';
            if (absen.keterangan === 'Sakit') statusBadge = 'bg-blue-100 text-blue-700';
            if (absen.keterangan === 'Alpha') statusBadge = 'bg-red-100 text-red-700';

            tbody.innerHTML += `
              <tr class="hover:bg-gray-50">
                <td class="p-3 font-medium text-gray-500">${index + 1}</td>
                <td class="p-3 font-semibold text-gray-800">${absen.nama || '-'}</td>
                <td class="p-3">${absen.kelas || '-'}</td>
                <td class="p-3 text-xs text-gray-500">${absen.waktu || '-'}</td>
                <td class="p-3"><span class="text-xs font-semibold px-2 py-1 rounded ${statusBadge}">${absen.keterangan || 'Hadir'}</span></td>
                <td class="p-3 text-center">
                  <button onclick="deleteAbsensi('${absen.id}')" class="text-xs bg-red-500 hover:bg-red-600 text-white font-medium px-2.5 py-1 rounded">Hapus</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">Belum ada riwayat presensi.</td></tr>';
        }
      } catch (err) {
        console.error("Gagal muat absensi:", err);
      }
    }

    // 8. HAPUS REKAP ABSENSI
    async function deleteAbsensi(id) {
      if (!confirm("Hapus catatan presensi ini?")) return;

      try {
        const res = await fetch(`/api/absensi/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          loadAbsensi();
        } else {
          alert("Gagal menghapus.");
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      }
    }
  </script>
</body>
</html>
